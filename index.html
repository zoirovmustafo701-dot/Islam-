<!DOCTYPE html>
<html lang="tg" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Нур — Ислом</title>
<meta name="theme-color" content="#1a5f7a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f4f8;color:#1a2b3c;padding-bottom:80px;min-height:100vh}
.main-header{background:linear-gradient(135deg,#1a5f7a,#2a8f9a);color:#fff;padding:24px 20px;text-align:center;border-radius:0 0 24px 24px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
.main-header h1{font-size:36px;font-weight:700;margin-bottom:4px;letter-spacing:2px}
.main-header p{font-size:16px;opacity:.9}
.screen{display:none;padding:20px}
.screen.active{display:block}
.screen h2{font-size:26px;font-weight:600;margin-bottom:20px;color:#1a5f7a;text-align:center}
.alphabet-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.letter-card{background:#fff;border-radius:16px;padding:16px 8px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90px;transition:transform .2s}
.letter-card:active{transform:scale(.95)}
.letter-card .arabic-letter{font-size:42px;font-weight:700;color:#1a5f7a;line-height:1.4;margin-bottom:4px}
.letter-card .letter-name{font-size:14px;color:#5a7a8a;font-weight:500}
.harakat-tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.h-tab{flex:1;padding:10px 6px;border:2px solid #e0e8f0;background:#fff;border-radius:12px;font-size:13px;font-weight:600;color:#5a7a8a;cursor:pointer;white-space:nowrap;font-family:inherit}
.h-tab.active{background:#1a5f7a;color:#fff;border-color:#1a5f7a}
.surah-list{display:flex;flex-direction:column;gap:10px}
.list-item{background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;display:flex;align-items:center;border-left:5px solid #2a8f9a;transition:transform .2s}
.list-item:active{transform:scale(.98)}
.list-item .item-number{font-size:16px;font-weight:700;color:#2a8f9a;background:#e8f4f8;min-width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-right:14px;flex-shrink:0}
.list-item .item-info{flex:1;min-width:0}
.list-item .item-title{font-size:18px;font-weight:600;color:#1a2b3c;margin-bottom:2px}
.list-item .item-subtitle{font-size:13px;color:#7a8a9a}
.list-item .item-arrow{font-size:22px;color:#b0c0d0;margin-left:6px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08);border-top:1px solid #e0e8f0;z-index:100;overflow-x:auto}
.nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;padding:6px 4px;cursor:pointer;color:#8a9aaa;font-size:10px;font-weight:500;border-radius:12px;min-width:55px;font-family:inherit}
.nav-btn.active{color:#1a5f7a}
.nav-btn .nav-icon{font-size:20px;margin-bottom:2px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;justify-content:center;align-items:flex-end}
.modal-overlay.active{display:flex}
.modal-content{background:#fff;width:100%;max-width:500px;max-height:90vh;border-radius:24px 24px 0 0;padding:24px;overflow-y:auto;position:relative;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-close{position:sticky;top:0;background:#f0f4f8;border:none;width:36px;height:36px;border-radius:50%;font-size:20px;color:#5a7a8a;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;margin-bottom:12px}
.letter-detail{text-align:center}
.letter-detail .big-letter{font-size:120px;font-weight:700;color:#1a5f7a;line-height:1.4;margin-bottom:8px}
.letter-detail .big-letter-name{font-size:24px;font-weight:600;color:#1a2b3c;margin-bottom:8px}
.btn-audio{background:linear-gradient(135deg,#1a5f7a,#2a8f9a);color:#fff;border:none;padding:14px 32px;border-radius:50px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 4px 15px rgba(26,95,122,.3);margin:6px 4px}
.btn-audio:active{transform:scale(.96)}
.btn-play-all{background:linear-gradient(135deg,#2a8f9a,#1a5f7a);color:#fff;border:none;padding:16px;border-radius:14px;font-size:17px;font-weight:600;cursor:pointer;width:100%;margin-bottom:16px;box-shadow:0 4px 15px rgba(26,95,122,.3)}
.arabic-text{font-size:30px;line-height:2;text-align:right;direction:rtl;color:#1a2b3c;margin-bottom:10px;padding:14px;background:#f8fafc;border-radius:14px;font-family:'Amiri','Traditional Arabic',serif}
.ayah-box{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid #e8eef4}
.ayah-num{font-size:13px;color:#8a9aaa;margin-bottom:8px;font-weight:600}
.surah-title{text-align:center;color:#1a5f7a;margin-bottom:20px;font-size:22px;font-weight:700}
.status{text-align:center;padding:40px 20px;font-size:17px;color:#7a8a9a;line-height:1.6}
.status.err{color:#c0392b}
.transcription-text{font-size:18px;color:#2a8f9a;background:#e8f4f8;padding:12px 16px;border-radius:12px;margin-bottom:12px;font-weight:500;line-height:1.6}
.translation-text{font-size:17px;color:#5a7a8a;padding:10px 16px;line-height:1.6}
.translation-label{font-size:13px;font-weight:600;color:#8a9aaa;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;padding-left:16px}
.namaz-step{background:#fff;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:5px solid #2a8f9a}
.namaz-step .step-num{font-size:14px;font-weight:700;color:#2a8f9a;margin-bottom:8px}
.namaz-step .step-title{font-size:18px;font-weight:600;color:#1a2b3c;margin-bottom:8px}
.namaz-step .step-text{font-size:16px;color:#5a7a8a;line-height:1.6}
.tajweed-card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:5px solid #f39c12}
.tajweed-card .t-title{font-size:17px;font-weight:600;color:#1a2b3c;margin-bottom:6px}
.tajweed-card .t-desc{font-size:15px;color:#5a7a8a;line-height:1.5}
.tajweed-card .t-example{font-size:22px;color:#1a5f7a;text-align:right;direction:rtl;margin-top:8px;font-family:'Amiri','Traditional Arabic',serif}
.azkar-box{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-left:5px solid #27ae60}
.azkar-box .a-text{font-size:28px;text-align:right;direction:rtl;color:#1a2b3c;font-family:'Amiri','Traditional Arabic',serif;margin-bottom:8px}
.azkar-box .a-trans{font-size:16px;color:#2a8f9a;margin-bottom:6px}
.azkar-box .a-transl{font-size:15px;color:#7a8a9a}
.azkar-box .a-count{font-size:13px;color:#e67e22;font-weight:600;margin-top:6px}
</style>
</head>

<header class="main-header"><h1>Нур</h1><p>Қуръон ва ислом</p></header>
<main>

<section id="screen-azkar" class="screen"><h2>Зикрҳо</h2><div id="azkarList"></div></section>

</main>

<script>

var tajweedData=[{title:'Нун сакина ва танвин',desc:'Нун с сукуном или танвин перед некоторыми буквами меняют произношение.',ex:'مِنْ بَعْدِ'},{title:'Идғом',desc:'Слияние нун сакина или танвина со следующей буквой.',ex:'مَنْ يَعْمَلْ'},{title:'Иқлоб',desc:'Нун сакина перед буквой ب превращается в م.',ex:'مِنْ بَعْدِ'},{title:'Ихфа',desc:'Скрытое произношение нун сакина перед 15 буквами.',ex:'أَنْتُمْ'},{title:'Изҳор',desc:'Ясное произношение нун сакина перед гортанными буквами.',ex:'مَنْ آمَنَ'},{title:'Мим сакина',desc:'Мим с сукуном перед ب — ихфа шафавия.',ex:'تَرْمِيهِمْ'},{title:'Қалқала',desc:'Буквы ق ط ب ج د с сукуном произносятся с отскоком.',ex:'قُلْ'},{title:'Мадд',desc:'Удлинение гласных: 2, 4 или 6 огласовок.',ex:'قَالَ'},{title:'Тафхим ва Тарқиқ',desc:'Твёрдое и мягкое произношение букв.',ex:'اللَّهُ'},{title:'Вақф',desc:'Правила остановки при чтении.',ex:'—'}];
var namazData=[{step:1,title:'Ният',text:'Дар дил ният кун, ки барои Худо намоз мехонӣ.'},{step:2,title:'Такбир',text:'Дастҳоро то гӯшҳо бардор ва бигӯ: «Аллоҳу Акбар».'},{step:3,title:'Қиём',text:'Дастҳоро баста, сураи «Ал-Фотиҳа» ва сураи дигарро хон.'},{step:4,title:'Рукуъ',text:'Хам шуда, бигӯ: «Субҳона Раббиял-Азим» (3 маротиба).'},{step:5,title:'Саҷда',text:'Ба замин саҷда кун ва бигӯ: «Субҳона Раббиял-Аъло» (3 маротиба).'},{step:6,title:'Ташаҳҳуд',text:'Дар охирин ракъат нишаста, «Ат-Таҳият» ва «Саловат»-ро хон.'},{step:7,title:'Салом',text:'Ба тарафи рост ва чап салом диҳ.'}];

var duasData=[{id:1,title:'Пеш аз хӯрок',arabic:'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ',transcription:'Аллоҳумма барик лана фима разақтана ва қина азабан-нар',translation:'Худоё, баракат деҳ ба мо дар он чӣ рӯзӣ додӣ ва моро аз азоби дӯзах нигаҳ дор'},{id:2,title:'Баъд аз хӯрок',arabic:'الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ',transcription:'Алҳамду лилляҳи аллазӣ атъамана ва сақана ва ҷаъалана муслимин',translation:'Ситоиш Худоро, ки моро таъом дод ва об дод ва моро мусулмон гардонд'},{id:3,title:'Пеш аз хоб',arabic:'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا',transcription:'Бисмика Аллоҳумма амуту ва аҳё',translation:'Ба номи Ту, Худоё, мемирам ва зинда мешавам'},{id:4,title:'Ҳангоми бедор',arabic:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ',transcription:'Алҳамду лилляҳи аллазӣ аҳёна баъда ма аматана ва илайҳин-нушур',translation:'Ситоиш Худоро, ки моро зинда кард баъд аз он ки моронд ва ба сӯи Ӯ бозгашт аст'},{id:5,title:'Баромадан аз хона',arabic:'بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ',transcription:'Бисмиллоҳи таваккалту алаллоҳи ва ла ҳавла ва ла қуввата илла биллоҳ',translation:'Ба номи Худо, ба Худо таваккал кардам, ва нест қуввате магар ба Худо'},{id:6,title:'Ворид шудан ба хона',arabic:'اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ الْمَوْلِجِ وَخَيْرَ الْمَخْرَجِ',transcription:'Аллоҳумма иннӣ асъалука хайрал-мавлиҷи ва хайрал-махраж',translation:'Худоё, ман аз Ту некӣ дар ҳангоми даромадан ва баромаданро хоҳам'},{id:7,title:'Пеш аз таом',arabic:'بِسْمِ اللَّهِ',transcription:'Бисмиллоҳ',translation:'Ба номи Худо'},{id:8,title:'Ҳангоми сафар',arabic:'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ',transcription:'Субҳаналлазӣ саххара лана ҳаза ва ма кунна лаҳу муқринӣн',translation:'Пок аст Худое, ки инро барои мо ром кард, ва мо ба он тавоно набудем'}];

var asmaData=['Ар-Раҳмон','Ар-Раҳим','Ал-Малик','Ал-Қуддус','Ас-Салом','Ал-Муъмин','Ал-Муҳаймин','Ал-Азиз','Ал-Ҷаббор','Ал-Мутакаббир','Ал-Холиқ','Ал-Бориъ','Ал-Мусаввир','Ал-Ғаффор','Ал-Қаҳҳор','Ал-Ваҳҳоб','Ар-Раззоқ','Ал-Фаттоҳ','Ал-Алим','Ал-Қобид','Ал-Босит','Ал-Хофиз','Ар-Рофеъ','Ал-Муизз','Ал-Музилл','Ас-Самиъ','Ал-Басир','Ал-Ҳакам','Ал-Адл','Ал-Латиф','Ал-Хабир','Ал-Халим','Ал-Азим','Ал-Ғафур','Аш-Шакур','Ал-Алий','Ал-Кабир','Ал-Ҳафиз','Ал-Муқит','Ал-Ҳасиб','Ал-Ҷалил','Ал-Карим','Ар-Рақиб','Ал-Муҷиб','Ал-Васиъ','Ал-Ҳаким','Ал-Вадуд','Ал-Маҷид','Ал-Боис','Аш-Шаҳид','Ал-Ҳақ','Ал-Вакил','Ал-Қавий','Ал-Маттин','Ал-Валий','Ал-Ҳамид','Ал-Мухси','Ал-Мубдиъ','Ал-Муид','Ал-Муҳйи','Ал-Мумит','Ал-Ҳай','Ал-Қайюм','Ал-Воҷид','Ал-Маҷид','Ал-Воҳид','Ал-Аҳад','Ас-Сомад','Ал-Қодир','Ал-Муқтадир','Ал-Муқаддим','Ал-Муаххир','Ал-Аввал','Ал-Охир','Аз-Зоҳир','Ал-Ботин','Ал-Волий','Ал-Мутаъоли','Ал-Барр','Ат-Таввоб','Ал-Мунтақим','Ал-Афувв','Ар-Рауф','Маликул-Мулк','Зул-Ҷалол','Ал-Муқсит','Ал-Ҷомеъ','Ал-Ғаний','Ал-Муғний','Ал-Маниъ','Ад-Дорр','Ан-Нафиъ','Ан-Нур','Ал-Ҳодий','Ал-Бадиъ','Ал-Боқий','Ал-Ворис','Ар-Рашид','Ас-Собур'];
var QURAN_KEY='nur_quran_v5';
var CDN='https://raw.githubusercontent.com/quran-by-verses/yaser-aldosry-128/main/verses/';
var FULL='https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee/';
var LETTER_AUDIO='https://raw.githubusercontent.com/Alifta/alifta.github.io/master/audio/letters/';
var currentHarakat='fatha';
function pad3(n){return String(n).padStart(3,'0');}
function loadQuran(){
  var statusEl=document.getElementById('loadStatus');
  var cached=localStorage.getItem(QURAN_KEY);
  if(cached){try{window.QURAN=JSON.parse(cached);renderSurahs();statusEl.textContent='';return;}catch(e){localStorage.removeItem(QURAN_KEY);}}
  statusEl.textContent='Дар ҳоли боргирӣ аз интернет...';
  fetch('https://api.alquran.cloud/v1/quran/quran-uthmani').then(function(r){return r.json();}).then(function(data){
    var grouped={};
    data.data.surahs.forEach(function(s){grouped[s.number]=s.ayahs.map(function(a){return a.text;});});
    window.QURAN=grouped;
    try{localStorage.setItem(QURAN_KEY,JSON.stringify(grouped));}catch(e){}
    renderSurahs();
  }).catch(function(e){statusEl.className='status err';statusEl.innerHTML='Хато.<br><small>'+e.message+'</small>';});
}
function renderSurahs(){var list=document.getElementById('surahList');if(!window.QURAN)return;var html='';for(var i=1;i<=114;i++){var ayahs=window.QURAN[i]?window.QURAN[i].length:0;html+='<div class="list-item" onclick="openSurahModal('+i+')"><div class="item-number">'+i+'</div><div class="item-info"><div class="item-title">'+SURAH_NAMES[i-1]+'</div><div class="item-subtitle">'+ayahs+' оят</div></div><div class="item-arrow">›</div></div>';}list.innerHTML=html;}
function renderAlphabet(){document.getElementById('alphabetGrid').innerHTML=alphabetData.map(function(item){return '<div class="letter-card" onclick="openLetterModal(\''+item.letter+'\',\''+item.name+'\',\''+item.audio+'\')"><div class="arabic-letter">'+item.letter+'</div><div class="letter-name">'+item.name+'</div></div>';}).join('');}
function renderHarakat(){var grid=document.getElementById('harakatGrid');var info=harakatInfo[currentHarakat];grid.innerHTML=alphabetData.map(function(item){var combined;if(currentHarakat==='madd'){combined='آ';}else if(currentHarakat==='tanween'){combined=item.letter+'\u064B';}else{combined=item.letter+info.mark;}return '<div class="letter-card" onclick="openHarakatModal(\''+item.letter+'\',\''+item.name+'\',\''+currentHarakat+'\')"><div class="arabic-letter">'+combined+'</div><div class="letter-name">'+item.name+'</div></div>';}).join('');}
function renderTajweed(){document.getElementById('tajweedList').innerHTML=tajweedData.map(function(t){return '<div class="tajweed-card"><div class="t-title">'+t.title+'</div><div class="t-desc">'+t.desc+'</div><div class="t-example">'+t.ex+'</div></div>';}).join('');}
function renderNamaz(){document.getElementById('namazList').innerHTML=namazData.map(function(s){return '<div class="namaz-step"><div class="step-num">Қадами '+s.step+'</div><div class="step-title">'+s.title+'</div><div class="step-text">'+s.text+'</div></div>';}).join('');}
function renderWudu(){document.getElementById('wuduList').innerHTML=wuduData.map(function(s){return '<div class="namaz-step"><div class="step-num">Қадами '+s.step+'</div><div class="step-title">'+s.title+'</div><div class="step-text">'+s.text+'</div></div>';}).join('');}
function renderDuas(){document.getElementById('duaList').innerHTML=duasData.map(function(item){return '<div class="list-item" onclick="openDuaModal('+item.id+')"><div class="item-number">'+item.id+'</div><div class="item-info"><div class="item-title">'+item.title+'</div></div><div class="item-arrow">›</div></div>';}).join('');}
function renderAzkar(){document.getElementById('azkarList').innerHTML=azkarData.map(function(a){return '<div class="azkar-box"><div class="a-text">'+a.text+'</div><div class="a-trans">'+a.trans+'</div><div class="a-transl">'+a.transl+'</div><div class="a-count">'+a.count+'</div></div>';}).join('');}
function renderAsma(){document.getElementById('asmaGrid').innerHTML=asmaData.map(function(name,idx){return '<div class="letter-card" style="min-height:70px"><div class="arabic-letter" style="font-size:20px">'+name+'</div><div class="letter-name">№'+(idx+1)+'</div></div>';}).join('');}
function openLetterModal(letter,name,audioName){var url=LETTER_AUDIO+audioName+'.mp3';document.getElementById('modal-body').innerHTML='<div class="letter-detail"><div class="big-letter">'+letter+'</div><div class="big-letter-name">'+name+'</div><button class="btn-audio" onclick="playUrl(\''+url+'\')">🔊 Бишнав</button></div>';document.getElementById('modal-overlay').classList.add('active');}
function openHarakatModal(letter,name,harakat){var info=harakatInfo[harakat];var combined;if(harakat==='madd'){combined='آ';}else if(harakat==='tanween'){combined=letter+'\u064B';}else{combined=letter+info.mark;}var ttsText=harakat==='sukun'?letter:combined;document.getElementById('modal-body').innerHTML='<div class="letter-detail"><div class="big-letter">'+combined+'</div><div class="big-letter-name">'+name+' + '+info.name+'</div><div class="harakat-note">Овоз: «'+info.example+'»</div><button class="btn-audio" onclick="playTTS(\''+ttsText+'\')">🔊 Бишнав</button></div>';document.getElementById('modal-overlay').classList.add('active');}
function openSurahModal(num){var ayahs=window.QURAN?window.QURAN[num]:null;if(!ayahs)return;var html='<div class="surah-title">'+SURAH_NAMES[num-1]+'</div>';html+='<button class="btn-play-all" onclick="playUrl(\''+FULL+num+'.mp3\')">▶️ Шунидани тамоми сура</button>';if(num!==1&&num!==9){html+='<div class="arabic-text" style="text-align:center;font-size:24px;">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>';}ayahs.forEach(function(text,idx){var audioUrl=CDN+pad3(num)+pad3(idx+1)+'.mp3';html+='<div class="ayah-box"><div class="ayah-num">Ояти '+(idx+1)+'</div><div class="arabic-text">'+text+'</div><button class="btn-audio" style="font-size:15px;padding:10px 22px;" onclick="playUrl(\''+audioUrl+'\')">🔊 Бишнав</button></div>';});document.getElementById('modal-body').innerHTML=html;document.getElementById('modal-overlay').classList.add('active');}
function openDuaModal(id){var d=duasData.filter(function(x){return x.id===id;})[0];if(!d)return;document.getElementById('modal-body').innerHTML='<div class="surah-title">'+d.title+'</div><div class="arabic-text">'+d.arabic+'</div><div class="transcription-text">'+d.transcription+'</div><div class="translation-label">Тарҷума:</div><div class="translation-text">'+d.translation+'</div><button class="btn-audio" onclick="playTTS(\''+d.arabic.replace(/'/g,"\\'")+'\')">🔊 Бишнав</button>';document.getElementById('modal-overlay').classList.add('active');}
function closeModal(){document.getElementById('modal-overlay').classList.remove('active');var p=document.getElementById('player');p.pause();}
function playUrl(url){var p=document.getElementById('player');try{p.pause();}catch(e){}p.src=url;p.load();setTimeout(function(){var pr=p.play();if(pr!==undefined){pr.catch(function(e){setTimeout(function(){p.play().catch(function(){});},300);});}},200);}
function playTTS(text){if('speechSynthesis' in window){var u=new SpeechSynthesisUtterance(text);u.lang='ar-SA';u.rate=0.6;speechSynthesis.cancel();speechSynthesis.speak(u);}}
var navItems=[{id:'alphabet',icon:'📖',label:'Алифбо'},{id:'harakat',icon:'َ◌',label:'Ҳаракат'},{id:'tajweed',icon:'🔤',label:'Таҷвид'},{id:'surahs',icon:'📚',label:'Сураҳо'},{id:'wudu',icon:'💧',label:'Таҳорат'},{id:'namaz',icon:'🕌',label:'Намаз'},{id:'duas',icon:'🤲',label:'Дуоҳо'},{id:'azkar',icon:'📿',label:'Зикрҳо'},{id:'asma',icon:'✨',label:'Асмоул Ҳусна'}];
document.getElementById('bottomNav').innerHTML=navItems.map(function(n,i){return '<button class="nav-btn'+(i===0?' active':'')+'" data-screen="'+n.id+'"><span class="nav-icon">'+n.icon+'</span><span>'+n.label+'</span></button>';}).join('');
var navBtns=document.querySelectorAll('.nav-btn');for(var bi=0;bi<navBtns.length;bi++){navBtns[bi].addEventListener('click',function(){var target=this.dataset.screen;var all=document.querySelectorAll('.nav-btn');for(var k=0;k<all.length;k++){all[k].classList.remove('active');}this.classList.add('active');var screens=document.querySelectorAll('.screen');for(var s=0;s<screens.length;s++){screens[s].classList.remove('active');if(screens[s].id==='screen-'+target)screens[s].classList.add('active');}});}
var hTabs=document.querySelectorAll('.h-tab');for(var ti=0;ti<hTabs.length;ti++){hTabs[ti].addEventListener('click',function(){currentHarakat=this.dataset.h;var all=document.querySelectorAll('.h-tab');for(var k=0;k<all.length;k++){all[k].classList.remove('active');}this.classList.add('active');renderHarakat();});}
renderAlphabet();renderHarakat();renderTajweed();renderNamaz();renderWudu();renderDuas();renderAzkar();renderAsma();loadQuran();
</script>
